<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 먹지? 🍽️</title>
  <meta name="description" content="음식 종류를 고르면 오늘의 점심을 추천해 드려요.">
  <style>
    /* ===== 색상·모양 설정: 여기 값을 바꾸면 전체 분위기가 바뀝니다 ===== */
    :root {
      --cream: #fff6e5;        /* 배경 크림색 */
      --card: #ffffff;         /* 카드 배경 */
      --orange: #ff8a3d;       /* 포인트 주황색 */
      --orange-dark: #e96f1f;  /* 버튼을 눌렀을 때 주황색 */
      --orange-soft: #ffe3cc;  /* 연한 주황색 */
      --text: #4a3524;         /* 기본 글자색 */
      --text-soft: #8a7361;    /* 흐린 글자색 */
      --radius: 24px;          /* 카드 모서리 둥글기 */
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      background: var(--cream);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      line-height: 1.5;
      word-break: keep-all;
    }

    .app {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.9rem, 7vw, 2.5rem);
      color: var(--orange-dark);
    }

    .intro {
      margin: 0 0 28px;
      font-size: 1.05rem;
      color: var(--text-soft);
    }

    /* 음식 종류 버튼 묶음: 화면이 좁으면 자동으로 줄바꿈됩니다 */
    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 3px solid var(--orange-dark);
      outline-offset: 3px;
    }

    .category-btn {
      min-height: 44px;
      padding: 10px 20px;
      border: 2px solid var(--orange-soft);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.15s;
    }

    .category-btn:hover {
      border-color: var(--orange);
    }

    /* 선택된 음식 종류 버튼 */
    .category-btn.selected {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
      transform: scale(1.06);
      box-shadow: 0 4px 12px rgba(255, 138, 61, 0.35);
    }

    .main-btn {
      width: 100%;
      min-height: 56px;
      padding: 14px 24px;
      border-radius: 999px;
      background: var(--orange);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      box-shadow: 0 6px 0 var(--orange-dark);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .main-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--orange-dark);
    }

    /* 추천 결과 카드 */
    .result-card {
      margin: 28px 0 20px;
      padding: 32px 24px;
      min-height: 230px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(233, 111, 31, 0.12);
    }

    .result-emoji {
      font-size: 5rem;
      line-height: 1.1;
    }

    .result-category {
      margin-top: 10px;
      padding: 3px 12px;
      border-radius: 999px;
      background: var(--orange-soft);
      color: var(--orange-dark);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .result-name {
      margin: 8px 0 6px;
      font-size: 1.7rem;
      font-weight: 800;
    }

    .result-desc {
      margin: 0;
      font-size: 1.05rem;
      color: var(--text-soft);
    }

    .placeholder {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-soft);
    }

    /* 결과가 나타날 때의 애니메이션 */
    .pop {
      animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.92);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pop {
        animation: none;
      }
      .category-btn,
      .main-btn {
        transition: none;
      }
    }

    .retry-btn {
      min-height: 48px;
      padding: 10px 28px;
      border: 2px solid var(--orange);
      border-radius: 999px;
      background: transparent;
      color: var(--orange-dark);
      font-size: 1.05rem;
      font-weight: 700;
      transition: background 0.15s;
    }

    .retry-btn:hover {
      background: var(--orange-soft);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 400px) {
      body {
        padding: 28px 14px;
      }
      .category-btn {
        padding: 10px 16px;
      }
      .result-emoji {
        font-size: 4.2rem;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>오늘 뭐 먹지? 🍽️</h1>
    <p class="intro">음식 종류를 고르면 오늘의 점심을 추천해 드려요.</p>

    <!-- 음식 종류 버튼은 JavaScript가 자동으로 만들어 넣습니다 -->
    <div class="categories" id="categories" role="group" aria-label="음식 종류 선택"></div>

    <button type="button" class="main-btn" id="recommendBtn">점심 메뉴 추천받기</button>

    <section class="result-card" id="resultCard" aria-live="polite">
      <p class="placeholder">오늘의 점심, 함께 골라볼까요?</p>
    </section>

    <button type="button" class="retry-btn" id="retryBtn" hidden>🔄 다시 추천</button>
  </main>

  <script>
    // ============================================================
    // ✏️ [수정 위치 1] 음식 종류 목록
    //  - 종류를 추가하거나 이름을 바꾸려면 여기를 고치세요.
    //  - '전체'는 모든 메뉴에서 뽑는 특별한 버튼이라 지우지 마세요.
    //  - 여기에 적은 이름은 아래 메뉴 목록의 category와 똑같아야 합니다.
    // ============================================================
    const CATEGORIES = ["전체", "한식", "중식", "일식", "양식", "분식"];

    // ============================================================
    // ✏️ [수정 위치 2] 메뉴 목록
    //  - 한 줄이 메뉴 하나입니다. 줄을 복사해서 붙여 넣으면 메뉴가 늘어납니다.
    //  - name: 메뉴 이름 / category: 음식 종류 / emoji: 이모지 / desc: 짧은 설명
    //  - 각 줄 끝의 쉼표(,)와 따옴표(")를 빠뜨리지 않도록 주의하세요.
    //  - 한 종류에는 메뉴를 2개 이상 넣어 주세요. (직전 메뉴를 빼고 뽑기 때문)
    // ============================================================
    const MENUS = [
      // ----- 한식 -----
      { name: "김치찌개", category: "한식", emoji: "🍲", desc: "얼큰한 국물에 밥 한 공기 뚝딱!" },
      { name: "비빔밥", category: "한식", emoji: "🥗", desc: "갖은 나물을 고추장에 쓱쓱 비벼요." },
      { name: "불고기", category: "한식", emoji: "🥩", desc: "달콤 짭짤한 양념이 밥도둑이에요." },
      { name: "된장찌개", category: "한식", emoji: "🥘", desc: "구수한 국물로 속이 편안해져요." },
      { name: "삼계탕", category: "한식", emoji: "🐔", desc: "뜨끈한 국물로 기운을 보충해요." },

      // ----- 중식 -----
      { name: "짜장면", category: "중식", emoji: "🍜", desc: "달콤 고소한 춘장 소스의 국민 메뉴!" },
      { name: "짬뽕", category: "중식", emoji: "🌶️", desc: "해물 가득 얼큰한 빨간 국물." },
      { name: "탕수육", category: "중식", emoji: "🍖", desc: "바삭한 튀김에 새콤달콤 소스." },
      { name: "볶음밥", category: "중식", emoji: "🍚", desc: "고슬고슬 불맛 나는 한 그릇." },
      { name: "군만두", category: "중식", emoji: "🥟", desc: "겉은 바삭, 속은 촉촉해요." },

      // ----- 일식 -----
      { name: "초밥", category: "일식", emoji: "🍣", desc: "신선한 생선과 새콤한 밥의 만남." },
      { name: "라멘", category: "일식", emoji: "🍥", desc: "진한 국물에 쫄깃한 면발." },
      { name: "돈가스", category: "일식", emoji: "🍱", desc: "두툼하고 바삭한 튀김의 정석." },
      { name: "우동", category: "일식", emoji: "🥢", desc: "통통한 면발과 따뜻한 국물." },
      { name: "카레라이스", category: "일식", emoji: "🍛", desc: "부드럽고 진한 카레를 듬뿍!" },

      // ----- 양식 -----
      { name: "파스타", category: "양식", emoji: "🍝", desc: "돌돌 말아 먹는 재미가 있어요." },
      { name: "피자", category: "양식", emoji: "🍕", desc: "쭉 늘어나는 치즈가 매력!" },
      { name: "햄버거", category: "양식", emoji: "🍔", desc: "한 입 가득 든든한 한 끼." },
      { name: "스테이크", category: "양식", emoji: "🍽️", desc: "육즙 가득, 오늘은 특별하게!" },
      { name: "샌드위치", category: "양식", emoji: "🥪", desc: "가볍고 신선하게 즐겨요." },

      // ----- 분식 -----
      { name: "떡볶이", category: "분식", emoji: "🍢", desc: "매콤 달콤 쫄깃한 국민 간식." },
      { name: "김밥", category: "분식", emoji: "🍙", desc: "한 줄에 영양이 골고루 쏙!" },
      { name: "라면", category: "분식", emoji: "🍜", desc: "꼬불꼬불 면발에 얼큰한 국물." },
      { name: "순대", category: "분식", emoji: "🌭", desc: "떡볶이 국물에 콕 찍어 먹어요." },
      { name: "튀김", category: "분식", emoji: "🍤", desc: "바삭바삭 골라 먹는 재미." }
    ];
    // ===================== 수정 위치 끝 =====================
    // 아래는 앱이 동작하는 부분입니다. 문구를 바꾸고 싶을 때만 살펴보세요.

    let selectedCategory = "전체"; // 처음에 선택되어 있는 음식 종류
    let lastMenu = null;           // 직전에 추천한 메뉴

    const categoriesEl = document.getElementById("categories");
    const recommendBtn = document.getElementById("recommendBtn");
    const retryBtn = document.getElementById("retryBtn");
    const resultCard = document.getElementById("resultCard");

    // 음식 종류 버튼 만들기
    CATEGORIES.forEach(function (category) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "category-btn";
      button.textContent = category;
      button.addEventListener("click", function () {
        selectedCategory = category;
        updateCategoryButtons();
      });
      categoriesEl.appendChild(button);
    });

    // 선택된 버튼만 눈에 띄게 표시하기
    function updateCategoryButtons() {
      categoriesEl.querySelectorAll(".category-btn").forEach(function (button) {
        const isSelected = button.textContent === selectedCategory;
        button.classList.toggle("selected", isSelected);
        button.setAttribute("aria-pressed", isSelected);
      });
    }

    // 선택한 종류에서 메뉴 하나를 무작위로 뽑기 (직전 메뉴는 제외)
    function pickMenu() {
      let candidates = MENUS.filter(function (menu) {
        return selectedCategory === "전체" || menu.category === selectedCategory;
      });

      // 직전 메뉴를 빼도 남는 메뉴가 있을 때만 제외합니다.
      const withoutLast = candidates.filter(function (menu) {
        return menu !== lastMenu;
      });
      if (withoutLast.length > 0) {
        candidates = withoutLast;
      }

      if (candidates.length === 0) {
        return null;
      }
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    // 추천 결과를 카드에 보여 주기
    function recommend() {
      const menu = pickMenu();
      resultCard.textContent = "";

      if (!menu) {
        addText("p", "placeholder", "이 종류에는 아직 메뉴가 없어요.");
        return;
      }

      lastMenu = menu;
      addText("div", "result-emoji", menu.emoji);
      addText("span", "result-category", menu.category);
      addText("div", "result-name", menu.name);
      addText("p", "result-desc", menu.desc);

      // 애니메이션을 매번 처음부터 다시 재생하기
      resultCard.classList.remove("pop");
      void resultCard.offsetWidth;
      resultCard.classList.add("pop");

      retryBtn.hidden = false;
    }

    // 카드 안에 글자 요소를 하나 추가하는 도우미 함수
    function addText(tag, className, text) {
      const element = document.createElement(tag);
      element.className = className;
      element.textContent = text;
      resultCard.appendChild(element);
    }

    recommendBtn.addEventListener("click", recommend);
    retryBtn.addEventListener("click", recommend);

    updateCategoryButtons();
  </script>
</body>
</html>
